name: Dependency Review

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review Dependencies
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        # License policy is enforced by the license-check job below via an
        # ALLOWLIST (strictly stronger than a denylist). deny-licenses was
        # removed: the action rejects both legacy (GPL-2.0) and modern
        # (GPL-2.0-only) SPDX ids in this repo's runs, red-gating every PR
        # on its own config validation. This job now reviews vulnerability
        # severity only. The placeholder allow-ghsas was dropped too.
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always

  license-check:
    name: License Compatibility Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install license checker
        run: npm install -g license-checker

      - name: Check licenses
        run: |
          license-checker --summary --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;Python-2.0;CC0-1.0;Unlicense;BlueOak-1.0.0;CC-BY-4.0;Artistic-2.0' --excludePrivatePackages

      - name: Generate license report
        run: |
          license-checker --csv --out licenses.csv
          echo "## License Report" >> $GITHUB_STEP_SUMMARY
          echo "| Package | License | Repository |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|---------|------------|" >> $GITHUB_STEP_SUMMARY
          license-checker --summary | grep -E '^├─|└─' | head -20 >> $GITHUB_STEP_SUMMARY || true